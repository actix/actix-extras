[package]
name = "russe"
version = "0.3.6"
authors = ["Rob Ede <robjtede@icloud.com>"]
description = "Server-Sent Events (SSE) encoder and decoder"
categories = ["web-programming", "encoding"]
keywords = ["sse", "server", "sent", "events", "event-source"]
repository.workspace = true
license.workspace = true
edition = "2024"
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[package.metadata.cargo_check_external_types]
allowed_external_types = ["bytestring::*", "tokio_util::*"]

[features]
awc-3 = ["dep:awc-3", "dep:err-report", "dep:futures-util", "tokio/macros", "tokio/time", "tokio-util/io"]
mime = ["dep:mime"]
reqwest-0_12 = ["dep:reqwest-0_12", "dep:futures-util", "tokio/macros", "tokio/time"]
reqwest-0_13 = ["dep:reqwest-0_13", "dep:futures-util", "tokio/macros", "tokio/time"]
ureq-3 = ["dep:ureq-3"]

[dependencies]
awc-3 = { package = "awc", version = "3", optional = true, default-features = false }
bytes = "1"
bytestring = { version = "1.6.1", features = ["simd", "std"] }
err-report = { version = "0.1", optional = true }
futures-util = { version = "0.3.18", optional = true }
impl-more = "0.3.8"
itoa = "1"
memchr = "2"
mime = { version = "0.3", optional = true }
reqwest-0_12 = { package = "reqwest", version = "0.12", optional = true, default-features = false, features = [
  "stream",
] }
reqwest-0_13 = { package = "reqwest", version = "0.13", optional = true, default-features = false, features = [
  "stream",
] }
tokio = { version = "1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1.41"
ureq-3 = { package = "ureq", version = "3", optional = true, default-features = false }

[dev-dependencies]
actix-http = "3"
color-eyre = "0.6"
divan = { package = "codspeed-divan-compat", version = "4" }
eyre = "0.6"
futures-test = "0.3"
futures-util = { version = "0.3.18", features = ["sink"] }
indoc = "2"
quickcheck = { version = "1", default-features = false }
quickcheck_macros = "1"
tokio = { version = "1.51", features = ["io-util", "macros", "net", "rt", "time"] }
tokio-stream = "0.1"
tokio-test = "0.4"
reqwest-0_13 = { package = "reqwest", version = "0.13", default-features = false, features = [
  "rustls",
] }
tokio-util = { version = "0.7", features = ["codec", "io", "rt", "time"] }
wiremock = "0.6"

[[example]]
name = "manager"
required-features = ["reqwest-0_12"]

[[example]]
name = "manager-awc"
required-features = ["awc-3"]

[[example]]
name = "ureq"
required-features = ["ureq-3"]

[[bench]]
name = "decoder"
harness = false

[[bench]]
name = "encoder"
harness = false

[lints]
workspace = true
