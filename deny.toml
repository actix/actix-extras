[licenses]
confidence-threshold = 0.90
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "BSL-1.0",
]
private = { ignore = true }

[bans]
multiple-versions = "allow"

[bans.build]
executables = "deny"

[advisories]
ignore = [
    "RUSTSEC-2026-0258", # DoS risk on empty DATA frames is not yet backported to v0.3
]
